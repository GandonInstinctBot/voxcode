name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\([0-9]*\.[0-9]*\)\..*/\1/')
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,     target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { os: ubuntu-24.04-arm,  target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest,      target: aarch64-apple-darwin,      ext: tar.gz }
          - { os: macos-15-intel,    target: x86_64-apple-darwin,       ext: tar.gz }
          - { os: windows-latest,    target: x86_64-pc-windows-msvc,    ext: zip }
    runs-on: ${{ matrix.os }}
    env:
      HARNESS_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: stamp version
        shell: bash
        run: sed -i.bak '0,/^version = .*/s//version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - run: cargo test --release --target ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: smoke check
        shell: bash
        run: |
          target/${{ matrix.target }}/release/harness --version
          target/${{ matrix.target }}/release/harness doctor
      - name: package
        shell: bash
        run: |
          name="harness-v${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir dist
          if [ "${{ matrix.ext }}" = zip ]; then
            cp target/${{ matrix.target }}/release/harness.exe .
            7z a "dist/$name.zip" harness.exe speech.py requirements-voice.txt README.md ACCEPTANCE.md benchmark.py
          else
            cp target/${{ matrix.target }}/release/harness .
            tar -czf "dist/$name.tar.gz" harness speech.py requirements-voice.txt README.md ACCEPTANCE.md benchmark.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
  publish:
    permissions:
      contents: write
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$tag" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
